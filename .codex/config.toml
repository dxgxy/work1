# Local Codex MCP configuration for the English learning PWA
# These servers are used for browser verification and current package documentation.

[mcp_servers.playwright]
command = "node"
args = ["C:/Users/31918/Documents/ChatGPT/app/source/node_modules/@playwright/mcp/cli.js", "--headless", "--browser", "msedge"]
startup_timeout_sec = 120
tool_timeout_sec = 60

[mcp_servers.context7]
command = "node"
args = ["C:/Users/31918/Documents/ChatGPT/app/source/node_modules/@upstash/context7-mcp/dist/index.js"]
startup_timeout_sec = 120
tool_timeout_sec = 60

[mcp_servers.context7.env]
OTEL_SDK_DISABLED = "true"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = false
startup_timeout_sec = 20
tool_timeout_sec = 45
