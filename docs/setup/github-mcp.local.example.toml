# Optional local GitHub MCP configuration
# Keep this file out of the active config until the package is installed and a token is available.
# Never commit a real token.

[mcp_servers.github]
command = "npx.cmd"
args = ["-y", "@modelcontextprotocol/server-github"]
startup_timeout_sec = 120
tool_timeout_sec = 60

[mcp_servers.github.env]
GITHUB_PERSONAL_ACCESS_TOKEN = "REPLACE_LOCALLY"
